name: CI

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  test-build:
    name: Build and cache image
    runs-on: ubuntu-latest
    env:
      TAG: test-image:${{ github.run_id }}
    outputs:
      cache-hit: ${{ steps.build.outputs.cache-hit }}
      key: ${{ steps.build.outputs.key }}
      path: ${{ steps.build.outputs.path }}
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        id: build
        uses: ./build
        with:
          tag: ${{ env.TAG }}
          file: tests/Dockerfile
          load: false
          prebuild: |
            echo "prebuild ran" > /tmp/prebuild.txt

      - name: Assert cache-hit is false on first build
        run: |
          if [ "${{ steps.build.outputs.cache-hit }}" = "true" ]; then
            echo "Expected cache-hit=false on a fresh build, got true"
            exit 1
          fi
          echo "cache-hit=false ✓"

      - name: Assert outputs are populated
        run: |
          [ -n "${{ steps.build.outputs.key }}" ]  || (echo "key output is empty"  && exit 1)
          [ -n "${{ steps.build.outputs.path }}" ] || (echo "path output is empty" && exit 1)
          echo "key=${{ steps.build.outputs.key }} ✓"
          echo "path=${{ steps.build.outputs.path }} ✓"

      - name: Assert image is not loaded
        run: |
          docker image ls
          docker image ls | grep test-image | wc -l | xargs test 0 -eq

      - name: Assert prebuild command ran
        run: |
          if [ ! -f /tmp/prebuild.txt ]; then
            echo "Expected prebuild command to run"
            exit 1
          fi
          grep "prebuild ran" /tmp/prebuild.txt
          echo "prebuild ran on cache miss ✓"

  test-restore:
    name: Restore cached image
    needs: test-build
    runs-on: ubuntu-latest
    env:
      TAG: test-image:${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - name: Restore image
        id: restore
        uses: ./restore
        with:
          tag: ${{ env.TAG }}
          file: tests/Dockerfile

      - name: Assert cache-hit is true
        run: |
          if [ "${{ steps.restore.outputs.cache-hit }}" != "true" ]; then
            echo "Expected cache-hit=true after build job, got false"
            exit 1
          fi
          echo "cache-hit=true ✓"

      - name: Assert image is loaded and runnable
        run: |
          docker run --rm ${{ env.TAG }} echo "hello from cache" | grep "hello from cache"
          echo "image runs correctly ✓"

  test-build-cache-hit:
    name: Build skipped on cache hit
    needs: test-build
    runs-on: ubuntu-latest
    env:
      TAG: test-image:${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - name: Build image (should hit cache)
        id: build
        uses: ./build
        with:
          tag: ${{ env.TAG }}
          file: tests/Dockerfile
          prebuild: |
            echo "prebuild ran" > /tmp/prebuild.txt

      - name: Assert cache-hit is true
        run: |
          if [ "${{ steps.build.outputs.cache-hit }}" != "true" ]; then
            echo "Expected cache-hit=true on repeated build, got false"
            exit 1
          fi
          echo "cache-hit=true on repeat build ✓"

      - name: Assert prebuild command skipped
        run: |
          if [ -f /tmp/prebuild.txt ]; then
            echo "Expected prebuild command to have been skipped"
            exit 1
          fi
          echo "prebuild skipped on cache hit ✓"

  test-buildx-args-build:
    name: Build with buildx-args
    runs-on: ubuntu-latest
    env:
      TAG: test-image-args:${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - name: Build image with build arg
        id: build
        uses: ./build
        with:
          tag: ${{ env.TAG }}
          file: tests/Dockerfile.args
          buildx-args: |
            --build-arg GREETING=ahoyhoy
            --build-arg RECIPIENT=matey

  test-buildx-args-restore:
    name: Restore with and check buildx-args
    needs: ["test-buildx-args-build"]
    runs-on: ubuntu-latest
    env:
      TAG: test-image-args:${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
      - name: Restore image
        id: restore
        uses: ./restore
        with:
          tag: ${{ env.TAG }}
          file: tests/Dockerfile.args

      - name: Assert build arg was applied
        run: |
          result=$(docker run --rm ${{ env.TAG }})
          echo "Container output: $result"
          echo "$result" | grep "ahoyhoy matey" || (echo "Expected 'ahoyhoy matey' in output" && exit 1)
          echo "buildx-args passed through correctly ✓"

  test-custom-key-path-build:
    name: Build and restore with custom key and path
    runs-on: ubuntu-latest
    env:
      TAG: test-image-custom:${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - name: Build with custom key and path
        uses: ./build
        with:
          tag: ${{ env.TAG }}
          key: custom-key-${{ github.run_id }}
          file: tests/Dockerfile
          path: /tmp/custom-location.tar

  test-custom-key-path-restore:
    needs: ["test-custom-key-path-build"]
    name: Build and restore with custom key and path
    runs-on: ubuntu-latest
    env:
      TAG: test-image-custom:${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - name: Restore with matching custom key and path
        id: restore
        uses: ./restore
        with:
          tag: ${{ env.TAG }}
          key: custom-key-${{ github.run_id }}
          path: /tmp/custom-location.tar

      - name: Assert restored correctly
        run: |
          docker run --rm ${{ env.TAG }} echo "custom path works" | grep "custom path works"
          echo "custom key/path ✓"

  test-single-job-build:
    name: "Single job inline use"
    runs-on: ubuntu-latest
    env:
      TAG: test-single-job:${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - name: Build image (cache empty)
        id: build
        uses: ./build
        with:
          tag: ${{ env.TAG }}
          file: tests/Dockerfile

      - name: Assert cache miss
        run: |
          if [ "${{ steps.build.outputs.cache-hit }}" == "false" ]; then
            echo "Expected cache-hit=true on second use, got false"
            exit 1
          fi
          echo "cache-hit=false ✓"

      - name: Assert image is loaded and runnable
        run: |
          docker run --rm ${{ env.TAG }} echo "hello" | grep "hello"
          echo "image loaded from cache and runs correctly ✓"

  test-single-job-cache-check:
    needs: ["test-single-job-build"]
    name: "Single job cache check"
    runs-on: ubuntu-latest
    env:
      TAG: test-single-job:${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - name: Check image is cached by restoring it
        uses: ./restore
        with:
          tag: ${{ env.TAG }}
          file: tests/Dockerfile

  # --- Unified root action (mode: build | restore) ---

  test-unified-build:
    name: Unified action build (cache miss)
    runs-on: ubuntu-latest
    env:
      TAG: test-unified:${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - name: Build via root action (default mode)
        id: build
        uses: ./
        with:
          tag: ${{ env.TAG }}
          file: tests/Dockerfile
          load: false

      - name: Assert cache-hit is false on first build
        run: |
          if [ "${{ steps.build.outputs.cache-hit }}" = "true" ]; then
            echo "Expected cache-hit=false on a fresh build, got true"
            exit 1
          fi
          echo "cache-hit=false ✓"

      - name: Assert outputs are populated
        run: |
          [ -n "${{ steps.build.outputs.key }}" ]  || (echo "key output is empty"  && exit 1)
          [ -n "${{ steps.build.outputs.path }}" ] || (echo "path output is empty" && exit 1)
          echo "key=${{ steps.build.outputs.key }} ✓"
          echo "path=${{ steps.build.outputs.path }} ✓"

  test-unified-restore:
    name: Unified action restore
    needs: test-unified-build
    runs-on: ubuntu-latest
    env:
      TAG: test-unified:${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - name: Restore via root action
        id: restore
        uses: ./
        with:
          mode: restore
          tag: ${{ env.TAG }}
          file: tests/Dockerfile

      - name: Assert cache-hit is true
        run: |
          if [ "${{ steps.restore.outputs.cache-hit }}" != "true" ]; then
            echo "Expected cache-hit=true after build job, got false"
            exit 1
          fi
          echo "cache-hit=true ✓"

      - name: Assert image is loaded and runnable
        run: |
          docker run --rm ${{ env.TAG }} echo "hello from unified cache" | grep "hello from unified cache"
          echo "image runs correctly ✓"

  test-unified-invalid-mode:
    name: Unified action rejects invalid mode
    runs-on: ubuntu-latest
    env:
      TAG: test-unified-bad:${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - name: Call root action with an invalid mode
        id: bad
        continue-on-error: true
        uses: ./
        with:
          mode: bogus
          tag: ${{ env.TAG }}
          file: tests/Dockerfile

      - name: Assert the action failed
        run: |
          if [ "${{ steps.bad.outcome }}" != "failure" ]; then
            echo "Expected invalid mode to fail the action, got '${{ steps.bad.outcome }}'"
            exit 1
          fi
          echo "invalid mode rejected ✓"
