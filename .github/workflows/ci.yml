name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-build:
    name: Build and cache image
    runs-on: ubuntu-latest
    env:
      TAG: test-image:${{ github.run_id }}
    outputs:
      cache-hit: ${{ steps.build.outputs.cache-hit }}
      key: ${{ steps.build.outputs.key }}
      path: ${{ steps.build.outputs.path }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        id: build
        uses: ./build
        with:
          tag: ${{ env.TAG }}
          file: tests/Dockerfile

      - name: Assert cache-hit is false on first build
        run: |
          if [ "${{ steps.build.outputs.cache-hit }}" = "true" ]; then
            echo "Expected cache-hit=false on a fresh build, got true"
            exit 1
          fi
          echo "cache-hit=false ✓"

      - name: Assert outputs are populated
        run: |
          [ -n "${{ steps.build.outputs.key }}" ]  || (echo "key output is empty"  && exit 1)
          [ -n "${{ steps.build.outputs.path }}" ] || (echo "path output is empty" && exit 1)
          echo "key=${{ steps.build.outputs.key }} ✓"
          echo "path=${{ steps.build.outputs.path }} ✓"

  test-restore:
    name: Restore cached image
    needs: test-build
    runs-on: ubuntu-latest
    env:
      TAG: test-image:${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore image
        id: restore
        uses: ./restore
        with:
          tag: ${{ env.TAG }}
          file: tests/Dockerfile

      - name: Assert cache-hit is true
        run: |
          if [ "${{ steps.restore.outputs.cache-hit }}" != "true" ]; then
            echo "Expected cache-hit=true after build job, got false"
            exit 1
          fi
          echo "cache-hit=true ✓"

      - name: Assert image is loaded and runnable
        run: |
          docker run --rm ${{ env.TAG }} echo "hello from cache" | grep "hello from cache"
          echo "image runs correctly ✓"

  test-build-cache-hit:
    name: Build skipped on cache hit
    needs: test-build
    runs-on: ubuntu-latest
    env:
      TAG: test-image:${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image (should hit cache)
        id: build
        uses: ./build
        with:
          tag: ${{ env.TAG }}
          file: tests/Dockerfile

      - name: Assert cache-hit is true
        run: |
          if [ "${{ steps.build.outputs.cache-hit }}" != "true" ]; then
            echo "Expected cache-hit=true on repeated build, got false"
            exit 1
          fi
          echo "cache-hit=true on repeat build ✓"

  test-buildx-args-build:
    name: Build with buildx-args
    runs-on: ubuntu-latest
    env:
      TAG: test-image-args:${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image with build arg
        id: build
        uses: ./build
        with:
          tag: ${{ env.TAG }}
          file: tests/Dockerfile.args
          buildx-args: --build-arg GREETING=ahoyhoy

  test-buildx-args-restore:
    name: Restore with and check buildx-args
    needs: ["test-buildx-args-build"]
    runs-on: ubuntu-latest
    env:
      TAG: test-image-args:${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore image
        id: restore
        uses: ./restore
        with:
          tag: ${{ env.TAG }}
          file: tests/Dockerfile.args

      - name: Assert build arg was applied
        run: |
          result=$(docker run --rm ${{ env.TAG }})
          echo "Container output: $result"
          echo "$result" | grep "ahoyhoy" || (echo "Expected 'ahoyhoy' in output" && exit 1)
          echo "buildx-args passed through correctly ✓"

  test-custom-key-path-build:
    name: Build and restore with custom key and path
    runs-on: ubuntu-latest
    env:
      TAG: test-image-custom:${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Build with custom key and path
        uses: ./build
        with:
          tag: ${{ env.TAG }}
          key: custom-key-${{ github.run_id }}
          file: tests/Dockerfile
          path: /tmp/custom-location.tar

  test-custom-key-path-restore:
    needs: ["test-custom-key-path-build"]
    name: Build and restore with custom key and path
    runs-on: ubuntu-latest
    env:
      TAG: test-image-custom:${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore with matching custom key and path
        id: restore
        uses: ./restore
        with:
          tag: ${{ env.TAG }}
          key: custom-key-${{ github.run_id }}
          path: /tmp/custom-location.tar

      - name: Assert restored correctly
        run: |
          docker run --rm ${{ env.TAG }} echo "custom path works" | grep "custom path works"
          echo "custom key/path ✓"
